<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EV3 Mindstorms - Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Tab Navigation -->
    <nav class="top-nav">
        <div class="tab-group">
            <a href="/design" id="btn-mode-design" class="tab-btn">Design</a>
            <a href="/run" id="btn-mode-run" class="tab-btn active">Run</a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <section id="run-view" class="view-panel">
            <div id="run-empty-notice" class="card empty-notice" style="display: none;">
                <h3>No Controls Configured</h3>
                <p>Create robot controls and assign motor ports.</p>
                <a href="/design" class="btn btn-primary" style="margin-top: 12px; display: inline-block;">
                    Open Design
                </a>
            </div>

            <div id="run-widget-list" class="run-widget-list">
                <!-- Dynamically populated run cards -->
            </div>
        </section>

        <!-- Diagnostics Drawer -->
        <section class="diagnostics-drawer card">
            <details id="diagnostics-details">
                <summary class="diagnostics-summary">
                    <span>Diagnostics &amp; Log</span>
                    <span class="text-muted text-sm">(Click to expand)</span>
                </summary>

                <div class="diagnostics-content">
                    <div class="telemetry-table-container">
                        <table class="telemetry-table">
                            <thead>
                                <tr>
                                    <th>Port</th>
                                    <th>Status</th>
                                    <th>Speed</th>
                                    <th>Position</th>
                                    <th>Duty</th>
                                    <th>Polarity</th>
                                </tr>
                            </thead>
                            <tbody id="telemetry-table-body">
                                <tr><td colspan="6" style="text-align:center;">Waiting for telemetry...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="log-container">
                        <div class="log-header">
                            <span>Command &amp; Event Log</span>
                            <button id="btn-clear-log" class="btn btn-sm btn-secondary">Clear</button>
                        </div>
                        <div id="log-box" class="log-box">
                            <div class="log-entry log-info">[System] Run initialized.</div>
                        </div>
                    </div>
                </div>
            </details>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-status">
            <div id="battery-badge" class="badge badge-info" title="EV3 Battery Voltage">
                <span>Battery: <strong id="battery-val">7.8</strong> V</span>
            </div>
            <div id="conn-badge" class="badge badge-connected">
                <span class="dot"></span>
                <span id="conn-text">Online</span>
            </div>
            <div id="latency-badge" class="badge badge-info" title="Round Trip Time">
                <span>RTT: <strong id="latency-val">12</strong> ms</span>
            </div>
        </div>
        <div class="footer-actions">
            <button id="btn-estop-header" class="btn btn-danger btn-estop" title="Emergency Stop All Motors (Spacebar)">
                STOP ALL
            </button>
            <button id="btn-shutdown-header" class="btn btn-secondary btn-shutdown" title="Safely Power Off EV3 Brick">
                Power Off
            </button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
