<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EV3 Mindstorms - Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Tab Navigation -->
    <nav class="top-nav">
        <div class="tab-group">
            <a href="/design" id="btn-mode-design" class="tab-btn active">Design</a>
            <a href="/run" id="btn-mode-run" class="tab-btn">Run</a>
        </div>
        <button id="btn-rescan" class="btn btn-secondary btn-sm" title="Scan for connected hardware on all ports">
            Rescan
        </button>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <section id="design-view" class="view-panel">
            <!-- Hardware Inventory Panel -->
            <div class="card hardware-card">
                <div class="card-header">
                    <h3>Connected Hardware</h3>
                    <span class="badge badge-info" id="hw-count-badge">Detecting...</span>
                </div>
                <div class="hardware-grid" id="hardware-list">
                    <div class="hw-item">Loading hardware status...</div>
                </div>
            </div>

            <!-- Widget Builder Toolbar -->
            <div class="card builder-toolbar-card">
                <div class="builder-toolbar">
                    <div class="builder-select-group">
                        <label for="widget-type-select">Type:</label>
                        <select id="widget-type-select">
                            <option value="joystick">2D Joystick</option>
                            <option value="slider">Speed Slider</option>
                            <option value="button">Action Button</option>
                            <option value="sensor">Sensor Display</option>
                        </select>
                    </div>
                    <div class="builder-buttons">
                        <button id="btn-add-widget" class="btn btn-primary">
                            Add
                        </button>
                        <button id="btn-reset-layout" class="btn btn-secondary btn-sm" title="Restore default starter widgets">
                            Reset Defaults
                        </button>
                    </div>
                </div>
            </div>

            <!-- Design Widget Card List -->
            <div class="widget-list-header">
                <h3>Active Controls</h3>
                <span class="text-muted" id="widget-count-label">0 active</span>
            </div>
            <div id="design-widget-list" class="design-widget-list">
                <!-- Dynamically populated widget config cards -->
            </div>
        </section>

        <!-- Diagnostics Drawer -->
        <section class="diagnostics-drawer card">
            <details id="diagnostics-details">
                <summary class="diagnostics-summary">
                    <span>Diagnostics &amp; Log</span>
                    <span class="text-muted text-sm">(Click to expand)</span>
                </summary>

                <div class="diagnostics-content">
                    <div class="telemetry-table-container">
                        <table class="telemetry-table">
                            <thead>
                                <tr>
                                    <th>Port</th>
                                    <th>Status</th>
                                    <th>Speed</th>
                                    <th>Position</th>
                                    <th>Duty</th>
                                    <th>Polarity</th>
                                </tr>
                            </thead>
                            <tbody id="telemetry-table-body">
                                <tr><td colspan="6" style="text-align:center;">Waiting for telemetry...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="log-container">
                        <div class="log-header">
                            <span>Command &amp; Event Log</span>
                            <button id="btn-clear-log" class="btn btn-sm btn-secondary">Clear</button>
                        </div>
                        <div id="log-box" class="log-box">
                            <div class="log-entry log-info">[System] Design initialized.</div>
                        </div>
                    </div>
                </div>
            </details>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-status">
            <div id="battery-badge" class="badge badge-info" title="EV3 Battery Voltage">
                <span>Battery: <strong id="battery-val">7.8</strong> V</span>
            </div>
            <div id="conn-badge" class="badge badge-connected">
                <span class="dot"></span>
                <span id="conn-text">Online</span>
            </div>
            <div id="latency-badge" class="badge badge-info" title="Round Trip Time">
                <span>RTT: <strong id="latency-val">12</strong> ms</span>
            </div>
        </div>
        <div class="footer-actions">
            <button id="btn-estop-header" class="btn btn-danger btn-estop" title="Emergency Stop All Motors (Spacebar)">
                STOP ALL
            </button>
            <button id="btn-shutdown-header" class="btn btn-secondary btn-shutdown" title="Safely Power Off EV3 Brick">
                Power Off
            </button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
